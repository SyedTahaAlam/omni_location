name: hybrid_location
description: Get device location using Wi-Fi, cell towers, IP, or BLE — no GPS required.
version: 0.1.0
homepage: https://github.com/yourname/hybrid_location

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  wifi_scan: ^0.4.1
  telephony: ^0.2.0
  flutter_blue_plus: ^1.31.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.0
  build_runner: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.hybrid_location
        pluginClass: HybridLocationPlugin
      ios:
        pluginClass: HybridLocationPlugin
